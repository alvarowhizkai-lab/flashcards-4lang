<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四国语言背单词 Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-top">
                <h1>🇨🇳🇬🇧🇪🇸🇧🇷 四国语言背单词 Pro</h1>
                <span id="total-progress">0 / 45</span>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-tab="study">📖 学习</button>
                <button class="nav-tab" data-tab="quiz">🎯 测验</button>
                <button class="nav-tab" data-tab="stats">📊 统计</button>
            </nav>
        </header>

        <main class="main-content">
            <!-- 学习模式 -->
            <section id="study-section" class="section active">
                <div class="category-filter">
                    <button class="cat-btn active" data-cat="all">全部</button>
                    <button class="cat-btn" data-cat="tech">科技</button>
                    <button class="cat-btn" data-cat="ev">电动车</button>
                    <button class="cat-btn" data-cat="trade">外贸</button>
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="study-progress"></div>
                </div>
                
                <div class="flashcard" id="flashcard">
                    <div class="card-inner" id="card-inner">
                        <!-- 正面 -->
                        <div class="card-face card-front">
                            <div class="word-english" id="word-en">点击开始学习</div>
                            <div class="lang-rows">
                                <div class="lang-row">
                                    <span class="flag">🇪🇸</span>
                                    <span class="label">西班牙语</span>
                                    <span class="trans" id="trans-es"></span>
                                </div>
                                <div class="lang-row">
                                    <span class="flag">🇧🇷</span>
                                    <span class="label">葡萄牙语</span>
                                    <span class="trans" id="trans-pt"></span>
                                </div>
                                <div class="lang-row">
                                    <span class="flag">🇨🇳</span>
                                    <span class="label">中文</span>
                                    <span class="trans" id="trans-cn"></span>
                                </div>
                            </div>
                            <div class="tap-hint">👆 点击查看例句</div>
                        </div>
                        <!-- 背面 -->
                        <div class="card-face card-back">
                            <div class="example-label">📝 例句</div>
                            <div class="example-row"><span class="flag">🇨🇳</span><span class="ex-text" id="ex-cn"></span></div>
                            <div class="example-row"><span class="flag">🇬🇧</span><span class="ex-text" id="ex-en"></span></div>
                            <div class="example-row"><span class="flag">🇪🇸</span><span class="ex-text" id="ex-es"></span></div>
                            <div class="example-row pt-row"><span class="flag">🇧🇷</span><span class="ex-text" id="ex-pt"></span></div>
                        </div>
                    </div>
                </div>
                
                <div class="actions">
                    <button class="btn btn-no" id="btn-no">😕 不认识</button>
                    <button class="btn btn-shuffle" id="btn-shuffle">🔀 随机</button>
                    <button class="btn btn-yes" id="btn-yes">😊 认识</button>
                </div>
            </section>

            <!-- 测验模式 -->
            <section id="quiz-section" class="section">
                <div class="quiz-header">
                    <h2>🎯 四国语测验</h2>
                    <span id="quiz-info">0 / 10 | 正确: 0</span>
                </div>
                <div class="quiz-card" id="quiz-card">
                    <div class="quiz-question" id="quiz-q">点击下方开始</div>
                    <div class="quiz-options" id="quiz-options"></div>
                </div>
                <div class="quiz-settings">
                    <select id="quiz-count"><option value="5">5题</option><option value="10" selected>10题</option><option value="20">20题</option></select>
                    <select id="quiz-type"><option value="pt">英→葡</option><option value="es">英→西</option><option value="mixed">混合</option></select>
                </div>
                <button class="btn btn-primary btn-large" id="start-quiz">🚀 开始测验</button>
            </section>

            <!-- 统计 -->
            <section id="stats-section" class="section">
                <div class="stats-header"><h2>📊 学习统计</h2></div>
                <div class="stats-grid">
                    <div class="stat-box"><div class="stat-num" id="stat-total">0</div><div class="stat-txt">总词数</div></div>
                    <div class="stat-box"><div class="stat-num" id="stat-learned">0</div><div class="stat-txt">已掌握</div></div>
                    <div class="stat-box"><div class="stat-num" id="stat-mistakes">0</div><div class="stat-txt">错题</div></div>
                    <div class="stat-box"><div class="stat-num" id="stat-rate">0%</div><div class="stat-txt">正确率</div></div>
                </div>
                <div class="cat-progress-section">
                    <div class="cat-p"><span class="cat-n">科技</span><div class="cat-b"><div class="cat-f" id="prog-tech"></div></div><span class="cat-c" id="cnt-tech">0/15</span></div>
                    <div class="cat-p"><span class="cat-n">电动车</span><div class="cat-b"><div class="cat-f" id="prog-ev"></div></div><span class="cat-c" id="cnt-ev">0/15</span></div>
                    <div class="cat-p"><span class="cat-n">外贸</span><div class="cat-b"><div class="cat-f" id="prog-trade"></div></div><span class="cat-c" id="cnt-trade">0/15</span></div>
                </div>
                <button class="btn btn-danger" id="reset-all">🔄 重置进度</button>
            </section>
        </main>

        <footer class="footer">💡 空格/回车:翻转 | ←不认识 | →认识</footer>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
