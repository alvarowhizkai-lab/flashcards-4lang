<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四国语言背单词 - 科技/电动车/外贸</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="header">
            <h1>🇨🇳🇬🇧🇪🇸🇧🇷 四国语言背单词</h1>
            <div class="stats">
                <span id="progress">0 / 45</span>
                <span id="known-count" class="known-badge">已学: 0</span>
            </div>
        </header>

        <!-- 分类筛选 -->
        <div class="category-filter">
            <button class="cat-btn active" data-category="all">全部</button>
            <button class="cat-btn" data-category="tech">科技</button>
            <button class="cat-btn" data-category="ev">电动车</button>
            <button class="cat-btn" data-category="trade">外贸</button>
        </div>

        <!-- 卡片区域 -->
        <div class="card-area">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <!-- 正面：英文主词 + 中西葡对照 -->
                    <div class="word-main" id="word-main">点击开始学习</div>
                    
                    <div class="translations-preview" id="translations-preview">
                        <div class="trans-row">
                            <span class="lang-flag">🇨🇳</span>
                            <span class="trans-value" id="trans-cn">-</span>
                        </div>
                        <div class="trans-row">
                            <span class="lang-flag">🇪🇸</span>
                            <span class="trans-value" id="trans-es">-</span>
                        </div>
                        <div class="trans-row">
                            <span class="lang-flag">🇧🇷</span>
                            <span class="trans-value" id="trans-pt">-</span>
                        </div>
                    </div>
                    
                    <div class="hint">点击查看例句 →</div>
                </div>
                
                <div class="card-face card-back">
                    <div class="back-label">📝 例句</div>
                    
                    <div class="example-block-main">
                        <span class="lang-flag">🇨🇳</span>
                        <div class="example-text" id="example-cn"></div>
                    </div>
                    <div class="example-block-main">
                        <span class="lang-flag">🇬🇧</span>
                        <div class="example-text" id="example-en"></div>
                    </div>
                    <div class="example-block-main">
                        <span class="lang-flag">🇪🇸</span>
                        <div class="example-text" id="example-es"></div>
                    </div>
                    <div class="example-block-main pt-highlight">
                        <span class="lang-flag">🇧🇷</span>
                        <div class="example-text" id="example-pt"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="actions">
            <button class="btn btn-no" id="btn-no">😕 不认识</button>
            <button class="btn btn-shuffle" id="btn-shuffle">🔀 随机</button>
            <button class="btn btn-yes" id="btn-yes">😊 认识</button>
        </div>

        <!-- 学习模式 -->
        <div class="mode-switch">
            <label>
                <input type="checkbox" id="show-pt"> 葡语高亮模式
            </label>
        </div>

        <!-- 底部提示 -->
        <footer class="footer">
            <p>💡 学习建议：先看英文想中文，再看西语，最后重点记忆葡语</p>
            <p>📱 空格/回车：翻转卡片 | ← 不认识 | → 认识</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
